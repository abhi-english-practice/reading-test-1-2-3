#aaa;padding:18px}.person{border-bottom:1px solid #d1cbbd;padding-bottom:20px;margin-bottom:22px;scroll-margin-top:20px}.person:last-child{border:0;margin-bottom:0;padding-bottom:0}.person h2{font:800 13px Arial;margin-bottom:12px}.person h2 b{display:inline-block;background:var(--cyan);padding:5px 10px;border:2px solid;margin-right:10px;border-radius:5px}.qcard{border-bottom:1px solid #d1cbbd;padding:0 0 20px;margin:0 0 20px}.qcard:last-child{margin:0;border:0}.qcard h3{font:700 15px/1.6 Arial;margin:0 0 12px}.choices{display:flex;gap:8px}.choices button{flex:1}.qcard .vi{font-size:13px;padding:8px 10px;margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:23px}.actions button{box-shadow:3px 3px 0 var(--ink)}.primary{background:var(--lime)}#message{font:13px/1.6 Arial;flex:1;min-width:180px}.glossary{border-top:2px solid;padding-top:20px;margin-top:28px}summary{font-weight:700;cursor:pointer}#glossaryRows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}.chunk{padding:17px;background:var(--paper);border:1.5px solid;border-radius:9px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.chunk strong{font-size:15px}.ipa{font:15px/1.7 Arial;color:#54534b;display:block;overflow-wrap:anywhere}.chunk p{font:14px/1.7 Arial;margin:5px 0}.chunk .vi{font-size:13px;padding:9px 12px}.chunk button{padding:6px 10px;height:35px}mark{background:#eaf3c8;color:inherit;border-bottom:1px solid #a0ad77;padding:0 1px}.audio-status{font:12px Arial;color:#666;min-height:15px}.review{font:15px/1.7 Arial;padding-top:10px}.review li{padding-bottom:10px}dialog{max-width:380px;border:2px solid;border-radius:13px;padding:25px}dialog::backdrop{background:#0008}[hidden]{display:none!important}.foot{font:11px monospace;color:#777;margin-top:22px}.headings-layout .panel:first-child{position:sticky;top:16px}.pagenav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.fullwidth{grid-column:1/-1}@media(max-width:750px){main{padding:20px 14px;margin:0 9px 25px}.layout{grid-template-columns:1fr}.headings-layout .panel:first-child{position:static}.panel{padding:18px;box-shadow:3px 3px 0}.text{font-size:18px;line-height:1.8}header{padding:15px}.headtools{gap:7px}.saved{display:none}#sections{gap:6px}#sections button{min-width:90px}.titleline{align-items:flex-start}.badge{font-size:11px;padding:6px}.options{gap:10px}#glossaryRows{grid-template-columns:1fr}.qcard{scroll-margin-top:10px}h1{font-size:29px}#tests button{padding:9px 4px}.actions button{padding:10px 12px}.foot{line-height:1.8}}@media print{header,nav,.actions,.speak,.mini-nav,.glossary,.pagenav{display:none}body{background:white}main{border:0;box-shadow:none}.layout{display:block}.panel{box-shadow:none}.headings-layout .panel:first-child{position:static}}
</style></head><body><header><div class="brand">POP <b>DOSSIER</b></div><div class="headtools"><span class="saved" id="saved">Reading practice</span><button id="vi" aria-pressed="false">Tiếng Việt: off</button></div></header><main><nav id="tests" aria-label="Choose a test"></nav><nav id="sections" aria-label="Choose an activity"></nav><div class="titleline"><div><span class="kicker" id="tag"></span><h1 id="title"></h1></div><span class="badge" id="progress"></span></div><p id="instruction"></p><div id="content" class="layout"></div><div class="actions"><button class="primary" id="check">Check answers</button><button id="reset">Reset task</button><button id="download">Download answers</button><span id="message" role="status"></span></div><details class="glossary"><summary id="glossaryTitle">Collocations &amp; useful phrases</summary><div id="glossaryRows"></div></details><p class="audio-status" id="audioStatus" role="status"></p><div class="foot" id="source"></div></main><dialog id="confirm"><p>Clear your answers for this task?</p><button id="cancel">Cancel</button> <button id="erase">Clear answers</button></dialog><script>const DATA=[{"title": "Test 1", "pages": "75–79", "parts": [{"type": "gap", "title": "A new job", "text": "Dear Susan,\nI’m writing to tell you the news. I’ve just got a new job!\nI applied last month and got {0} last Monday!\nI’m secretary to the general manager. I {1} his calls and book his {2}. Apart from that, I also {3} to the suppliers, {4} is my favourite part of the job.\nI’m really looking forward to seeing you soon.\nLove,\nHelen", "options": [["it", "that", "this"], ["save", "take", "collect"], ["cars", "travels", "flights"], ["treat", "manage", "talk"], ["so", "which", "because"]], "answer": [["it"], ["take"], ["flights"], ["talk"], ["which"]], "vi": "Susan thân mến,\nMình viết thư để báo tin cho bạn. Mình vừa có công việc mới! Mình nộp đơn tháng trước và được nhận vào thứ Hai vừa rồi! Mình làm thư ký cho tổng giám đốc. Mình nghe điện thoại và đặt chuyến bay cho ông ấy. Ngoài ra, mình còn trao đổi với các nhà cung cấp, đó là phần mình thích nhất trong công việc.\nMình rất mong sớm được gặp bạn.\nThân mến,\nHelen", "glossary": [["take his calls", "teɪk hɪz kɔːlz", "Answer telephone calls for him.", "nghe điện thoại thay ông ấy · take a call"], ["book his flights", "bʊk hɪz flaɪts", "Arrange his plane tickets.", "đặt vé máy bay cho ông ấy"], ["looking forward to", "ˈlʊkɪŋ ˈfɔːwəd tə", "Feeling happy about something that will happen.", "mong chờ · look forward to + danh từ/V-ing"]]}, {"type": "sequence", "title": "The cancelled flight", "start": "I woke up earlier because I didn’t want to miss the flight.", "lines": ["I quickly paid and headed to the departure area.", "I had already packed so I just had a shower and hailed a taxi in the street.", "We finally managed to get to the airport two hours later.", "On the way to the airport, we got stuck in a traffic jam.", "I ran to check in only to find that the flight had been cancelled."], "answer": [1, 3, 2, 0, 4], "vi": ["Tôi dậy sớm hơn vì không muốn lỡ chuyến bay.", "Tôi nhanh chóng trả tiền và đi về phía khu khởi hành.", "Tôi đã xếp đồ từ trước nên chỉ tắm rồi ra đường vẫy taxi.", "Cuối cùng, chúng tôi cũng đến được sân bay sau hai tiếng.", "Trên đường ra sân bay, chúng tôi bị kẹt xe.", "Tôi chạy đến làm thủ tục, rồi mới phát hiện chuyến bay đã bị hủy."], "glossary": [["miss the flight", "mɪs ðə flaɪt", "Arrive too late to catch the plane.", "lỡ chuyến bay"], ["hailed a taxi", "heɪld ə ˈtæksi", "Signalled to a taxi to stop.", "vẫy taxi"], ["stuck in a traffic jam", "stʌk ɪn ə ˈtræfɪk dʒæm", "Unable to move because the road is crowded.", "bị kẹt xe"], ["had been cancelled", "həd biːn ˈkænsəld", "Had been stopped from happening before another past event.", "đã bị hủy trước một mốc quá khứ · quá khứ hoàn thành bị động"]]}, {"type": "sequence", "title": "After work", "start": "I was checking emails at work before leaving as I do every day.", "lines": ["I headed for the pub because I was meeting a friend there to catch up.", "As I set foot on the street, I immediately noticed it was getting dark.", "I cleared my desk, said goodbye to everyone, took my bag and left.", "As soon as I went into the pub, I saw him.", "It was love at first sight."], "answer": [2, 1, 0, 3, 4], "vi": ["Tôi đang kiểm tra email ở chỗ làm trước khi về như mọi ngày.", "Tôi đi đến quán rượu vì có hẹn gặp một người bạn ở đó để trò chuyện, hỏi thăm nhau.", "Vừa bước ra đường, tôi lập tức nhận thấy trời đang tối dần.", "Tôi dọn bàn, chào tạm biệt mọi người, cầm túi rồi đi.", "Ngay khi bước vào quán, tôi nhìn thấy anh ấy.", "Đó là tình yêu từ cái nhìn đầu tiên."], "glossary": [["catch up", "kætʃ ʌp", "Talk and exchange news after time apart.", "trò chuyện, cập nhật tình hình của nhau"], ["set foot on", "set fʊt ɒn", "Step onto or enter a place.", "đặt chân lên/đến"], ["love at first sight", "lʌv ət fɜːst saɪt", "Love felt when seeing someone for the first time.", "tình yêu từ cái nhìn đầu tiên"]]}, {"type": "matching", "title": "Working from home", "texts": ["I think working from home is the future. I love not having to commute which is not only good for the environment, but also saves time. I don’t need to wait for the bus or take the car. I can spend that extra free time with my family and friends. This gets me in a better mood to commit to my job and enjoy doing it. I like having the chance to choose how to spend my free time and with whom.", "I hate working from home. I’m all alone with no-one to talk to, I’m interrupted by endless phone calls while I’m having lunch, or dinner, sometimes. When I need clarification or to get feedback to move on with some task, I don’t necessarily get a good connection or understand what I’m told on online meetings. It’s hard to have team meetings as everybody talks at the same time and it’s hard to follow what's being discussed. It ends up being a 24 hours job because you don’t get things done right from the start and you have to wait for others to get connected.", "What is hard is to be disciplined. Working from home means you are actually at home, where there's TV, a book you’re reading, music, YouTube, and no boss or team watching over your head telling you to keep up. So, if you’re not disciplined like me, you may not get the work done right and on time. However, once you finally get started, it’s nice to work from home, where you can create your own environment, organise things as you like, and there’s no talk as to who got the best office and who the worst. There’s less office gossip going around in general, and that’s good.", "Being able to decide when to do what is great. I have my tasks, and I can get organised the way I want to. There’re no interruptions, no people coming to you with questions or requests all the time, which makes it very hard for me to concentrate and focus on what I’m doing. You can always get connected on Skype, Teams, Zoom, and others and have meetings without the need to be then constantly interrupted when you need to focus on something. The connection is sometimes not so good, but all in all, I get more work done now than when I worked in the office."], "questions": ["Who thinks internet connections can make things harder?", "Who says working from home helps concentration?", "Who values not having their boss around?", "Who thinks if people aren’t organised, working from home is harder?", "Who enjoys the chance to deal with work freely?", "Who appreciates the freedom to choose how to spend time?", "Who thinks it’s hard to solve doubts when working from home?"], "answer": [["B", "D"], ["D"], ["C"], ["C"], ["D"], ["A"], ["B"]], "vi": ["Tôi nghĩ làm việc tại nhà là tương lai. Tôi thích việc không phải đi lại đến chỗ làm, vừa tốt cho môi trường vừa tiết kiệm thời gian. Tôi không cần chờ xe buýt hay lái xe. Tôi có thể dành khoảng thời gian rảnh thêm đó cho gia đình và bạn bè. Điều này giúp tâm trạng tôi tốt hơn để tận tâm với công việc và thấy vui khi làm việc. Tôi thích có cơ hội lựa chọn cách sử dụng thời gian rảnh và ở bên ai.", "Tôi ghét làm việc tại nhà. Tôi chỉ có một mình, không có ai trò chuyện; tôi bị gián đoạn bởi vô số cuộc gọi khi đang ăn trưa, đôi khi cả lúc ăn tối. Khi cần được giải thích rõ hoặc nhận phản hồi để tiếp tục nhiệm vụ, đường truyền không phải lúc nào cũng tốt và tôi cũng không phải lúc nào hiểu điều người khác nói trong cuộc họp trực tuyến. Họp nhóm rất khó vì mọi người nói cùng lúc, khiến tôi khó theo dõi nội dung. Cuối cùng công việc kéo dài suốt 24 giờ vì mọi thứ không được làm đúng ngay từ đầu và tôi phải chờ người khác kết nối.", "Điều khó là phải có kỷ luật. Làm việc tại nhà nghĩa là bạn thực sự ở nhà, nơi có tivi, cuốn sách đang đọc, âm nhạc, YouTube, và không có sếp hay đồng đội giám sát, nhắc nhở theo kịp tiến độ. Vì vậy, nếu thiếu kỷ luật như tôi, bạn có thể không hoàn thành công việc đúng yêu cầu và đúng hạn. Tuy nhiên, khi cuối cùng đã bắt tay vào làm, làm việc tại nhà lại khá dễ chịu: bạn có thể tạo môi trường riêng, sắp xếp mọi thứ theo ý mình và không phải nghe chuyện ai được phòng làm việc tốt nhất, ai nhận phòng tệ nhất. Nhìn chung, chuyện ngồi lê đôi mách ở công sở ít hơn, và đó là điều tốt.", "Được tự quyết định khi nào làm việc gì thật tuyệt. Tôi có các nhiệm vụ và có thể sắp xếp theo cách mình muốn. Không có sự gián đoạn, không có người liên tục đến hỏi hoặc nhờ việc, những điều vốn khiến tôi rất khó tập trung vào việc đang làm. Bạn luôn có thể kết nối qua Skype, Teams, Zoom và các công cụ khác để họp, rồi không bị làm phiền liên tục khi cần tập trung. Đôi lúc đường truyền không tốt lắm, nhưng nhìn chung, giờ tôi làm được nhiều việc hơn so với khi làm ở văn phòng."], "qvi": ["Ai cho rằng đường truyền internet có thể gây khó khăn hơn?", "Ai nói làm việc tại nhà giúp tập trung?", "Ai coi trọng việc không có sếp ở bên?", "Ai cho rằng người thiếu ngăn nắp, kỷ luật sẽ gặp khó khăn hơn khi làm tại nhà?", "Ai thích cơ hội tự chủ xử lý công việc?", "Ai coi trọng quyền tự chọn cách sử dụng thời gian?", "Ai cho rằng khó được giải đáp thắc mắc khi làm việc tại nhà?"], "glossary": [["commit to my job", "kəˈmɪt tə maɪ dʒɒb", "Give my work time and serious effort.", "tận tâm với công việc"], ["get feedback", "ɡet ˈfiːdbæk", "Receive comments about your work.", "nhận phản hồi"], ["on time", "ɒn taɪm", "At the correct or agreed time.", "đúng giờ, đúng hạn"], ["focus on", "ˈfəʊkəs ɒn", "Give your attention to something.", "tập trung vào · focus on + danh từ/V-ing"]], "notes": {"0": "B describes poor connections; D also explicitly says the connection is sometimes not good. Both fit this wording."}, "notesvi": {"0": "B nêu vấn đề đường truyền kém; D cũng nói đôi lúc kết nối không tốt. Cả hai phù hợp với cách hỏi này."}}, {"type": "headings", "title": "First expeditions to the Antarctic", "texts": ["Greek philosophers theorised Earth in a Spherical shape identifying the North and South Polar regions between 600 BC and 300 BC. These theories led to great intrigue, debate and even deaths at the time. On that same line, there are many scripts and maps from the 15th and 18th centuries which also inspired the belief in a hypothetical continent called Terra Australis in the Southern Hemisphere. However, no explorations had been conducted yet. It was only theory what led physicists and analysts to believe in the need for balance to the already known and inhabited North Pole.", "The theory of balancing land inspired many explorers, including, many centuries later, Captain Cook, to risk their lives in the pursuit of surveying and mapping the southern hemisphere. Many reports tell us about a curious Polynesian navigator, Ui-te-Rangiora, who searched the southern seas. He first reported the finding of ice floes and icebergs in the ocean area of what he called Tai-uka-a-pia \"sea foaming like arrowroot”. Polynesians discovered and populated the Auckland Islands in the 13th century according to archeological findings conducted later, being these islands the most southernly Polynesians have ever been known to settle.", "It was Ferdinand Magellan leading a fleet of 5 vessels who first ventured towards Patagonia lands and connected the two Masses of big Pacific and Atlantic water through the Strait of Magellan, which he called “Peaceful sea”. The expedition managed to land on the Philippine Islands where he lost his life in the battle of Mactan. One of his ships struggled his way back home to Spain via the Indian Ocean earning the prize of being the first round sailing of the globe. Not only Magellan's but many lives were lost in these early ventures to draw a picture of our world as we know it today.", "It was in the 16th and 17th centuries when early mapping and proven observation of southern seas encouraged many adventurers and sailors onto the quest for both wealth and glory, leading to the mapping of what we refer to today as Latin America. Among these heroes we find Francis Drake, Dirk Gerritsz, Gabriel de Castilla, Jacob le Maire, and William Schouten. Some accounts identify Dirck Gerritsz Pomp as the first European to sight the Antarctica, though others attribute the privilege to Gabriel de Castilla. The eagerness for discovery was growing as the land became less and less of a mystery.", "Not only were lands new to men, water proved to be surprising as well. What is now called the Antarctic Convergence or Antarctic Polar Front posed many hardships to sailors. The Antarctic convergence is a natural curve running round Antarctica, varying in latitude with the seasons. This circular frontier divides the cold northern Antarctic waters from the somewhat warmer waters of the subantarctic. This barrier stands in-between two distinctive marine environments and climates, posing a stumbling block to sailors and explorers. It was first crossed by Anthony de la Roché who first reported landing on South Georgia island.", "Every sea heavy storm and battle tested the equipment structures and materials with which our heroes pursued their dreams. Ships were among the most damaged and challenged goods. As every captain, James Cook had the apple of his eye. He earnestly counted on the HMS Resolution, a converted merchant collier, adjusted by the Royal British Navy, on which he made his second and third voyages of exploration in the Pacific. He called her “The ship of my choice, and “The fittest for service of any I have seen”.", "The 19th century produced a series of first achievements on Antarctica. Mercator Cooper was the first to beat all odds and properly document his setting foot on the icy mainland of Antarctica, and the HMS Challenger ship was the first steamship to cross the Antarctic Circle. The first to ski the Antarctica’s slopes was Norwegian Carl Anton Larsen aboard the Jason. Only a few had attempted it before, but it was Adrien de Gerlache to first winter in Antarctica. It’s not easy to imagine how these men felt knowing they would lead a trail of future scientists, researchers, merchants, and settlers into a once unknown peaceful white divinity of a distant land."], "options": ["A natural water barrier", "Landing on your dreams", "Not every vessel could make it", "Everything was dreams and calculations", "Surge of curiosity and discovery", "First sightings", "Getting the world connected", "Giving up all too soon"], "answer": [3, 5, 6, 4, 0, 2, 1], "vi": ["Các triết gia Hy Lạp đã đưa ra lý thuyết Trái Đất hình cầu, xác định các vùng cực Bắc và cực Nam trong khoảng từ năm 600 đến 300 trước Công nguyên. Những lý thuyết này gây ra sự tò mò, tranh luận lớn và thậm chí cả những cái chết thời bấy giờ. Theo cùng hướng đó, nhiều văn bản và bản đồ từ thế kỷ XV đến XVIII cũng nuôi dưỡng niềm tin vào một lục địa giả định tên là Terra Australis ở Nam bán cầu. Tuy nhiên, chưa có cuộc thám hiểm nào được tiến hành. Chỉ có lý thuyết khiến các nhà vật lý và phân tích tin rằng cần một vùng đất để cân bằng với Bắc Cực đã được biết đến và có người sinh sống.", "Lý thuyết về vùng đất cân bằng đã truyền cảm hứng cho nhiều nhà thám hiểm, kể cả thuyền trưởng Cook nhiều thế kỷ sau, liều mạng khảo sát và lập bản đồ Nam bán cầu. Nhiều ghi chép kể về nhà hàng hải Polynesia ham khám phá Ui-te-Rangiora, người đã tìm kiếm ở các vùng biển phía nam. Ông là người đầu tiên báo cáo việc phát hiện các tảng băng nổi và núi băng trong vùng biển mà ông gọi là Tai-uka-a-pia, nghĩa là “biển sủi bọt như bột củ dong”. Theo các phát hiện khảo cổ sau này, người Polynesia đã khám phá và sinh sống trên quần đảo Auckland vào thế kỷ XIII; đây là nơi xa nhất về phía nam mà họ được biết là từng định cư.", "Ferdinand Magellan, dẫn đầu một hạm đội năm tàu, là người đầu tiên tiến về vùng Patagonia và nối hai khối nước Thái Bình Dương, Đại Tây Dương qua eo biển Magellan, nơi ông gọi là “biển yên bình”. Đoàn thám hiểm đã đến được quần đảo Philippines, nơi ông thiệt mạng trong trận Mactan. Một con tàu của ông chật vật trở về Tây Ban Nha qua Ấn Độ Dương, giành vị trí đầu tiên hoàn thành chuyến đi thuyền vòng quanh thế giới. Không chỉ Magellan, nhiều người khác cũng mất mạng trong những chuyến đi ban đầu nhằm vẽ nên bức tranh thế giới mà chúng ta biết ngày nay.", "Vào thế kỷ XVI và XVII, việc lập bản đồ ban đầu cùng những quan sát đã được xác thực về các vùng biển phía nam khuyến khích nhiều nhà thám hiểm và thủy thủ lên đường tìm kiếm cả của cải lẫn vinh quang, dẫn đến việc lập bản đồ vùng ngày nay gọi là Mỹ Latinh. Trong số họ có Francis Drake, Dirk Gerritsz, Gabriel de Castilla, Jacob le Maire và William Schouten. Một số ghi chép xác định Dirck Gerritsz Pomp là người châu Âu đầu tiên nhìn thấy Nam Cực, trong khi những tài liệu khác dành vị trí đó cho Gabriel de Castilla. Khát vọng khám phá ngày càng lớn khi vùng đất bớt dần bí ẩn.", "Không chỉ đất liền mới lạ với con người, biển cũng chứa đựng bất ngờ. Vùng ngày nay gọi là Hội tụ Nam Cực hay Frông Cực Nam Cực gây nhiều khó khăn cho thủy thủ. Đây là một đường cong tự nhiên bao quanh Nam Cực, thay đổi vĩ độ theo mùa. Ranh giới dạng vòng tròn này phân chia vùng nước Nam Cực lạnh ở phía bắc với vùng nước cận Nam Cực ấm hơn đôi chút. Rào cản này nằm giữa hai môi trường biển và khí hậu khác biệt, trở thành trở ngại cho thủy thủ và nhà thám hiểm. Anthony de la Roché là người đầu tiên vượt qua và báo cáo việc đổ bộ lên đảo Nam Georgia.", "Mỗi cơn bão biển dữ dội và trận chiến đều thử thách kết cấu, vật liệu của các trang thiết bị mà những người hùng dùng để theo đuổi giấc mơ. Tàu thuyền thuộc nhóm tài sản chịu hư hại và thử thách nhiều nhất. Như các thuyền trưởng khác, James Cook cũng có con tàu mình đặc biệt yêu quý. Ông tin cậy HMS Resolution, một tàu buôn chở than được Hải quân Hoàng gia Anh cải biến, dùng trong chuyến thám hiểm thứ hai và thứ ba ở Thái Bình Dương. Ông gọi nó là “con tàu tôi lựa chọn” và “con tàu phù hợp phục vụ nhất trong số những tàu tôi từng thấy”.", "Thế kỷ XIX chứng kiến hàng loạt thành tựu đầu tiên tại Nam Cực. Mercator Cooper là người đầu tiên vượt qua mọi trở ngại và ghi chép đầy đủ việc đặt chân lên phần đất liền băng giá của Nam Cực; HMS Challenger là tàu hơi nước đầu tiên vượt Vòng Nam Cực. Người đầu tiên trượt tuyết trên các sườn dốc Nam Cực là Carl Anton Larsen người Na Uy, đi trên tàu Jason. Trước đó chỉ vài người từng thử, nhưng Adrien de Gerlache mới là người đầu tiên trải qua mùa đông ở Nam Cực. Khó hình dung cảm giác của họ khi biết mình mở đường cho các nhà khoa học, nhà nghiên cứu, thương nhân và người định cư tương lai đến vùng đất xa xôi trắng muốt, yên bình từng chưa ai biết tới."], "glossary": [["risk their lives", "rɪsk ðeə laɪvz", "Do something that could cause their deaths.", "mạo hiểm tính mạng"], ["in the pursuit of", "ɪn ðə pəˈsjuːt əv", "While trying to achieve something.", "trong quá trình theo đuổi · in pursuit of + danh từ/V-ing"], ["beat all odds", "biːt ɔːl ɒdz", "Succeed despite great difficulties.", "vượt qua mọi trở ngại"], ["setting foot on", "ˈsetɪŋ fʊt ɒn", "Stepping onto a place for the first time in this context.", "đặt chân lên"]], "ovi": ["Rào cản tự nhiên trên biển", "Đặt chân tới giấc mơ", "Không phải tàu nào cũng vượt qua được", "Mọi thứ mới chỉ là giấc mơ và tính toán", "Làn sóng tò mò và khám phá", "Những lần đầu nhìn thấy", "Kết nối thế giới", "Từ bỏ quá sớm"]}]}, {"title": "Test 2", "pages": "80–85", "parts": [{"type": "gap", "title": "News about Pete", "text": "Hi Helen,\nGuess what! I ran into Pete yesterday. It’s been such a long time since we last {0}. He told me he {1} married last year and that his wife is now pregnant. He’s {2} to be a dad!! Wonderful! I was very happy for him. He {3} he needs to move because their flat is too small now. Why don’t we go visit them this weekend? {4} you like that?\nCheers,\nJenny", "options": [["met", "see", "meet"], ["is", "got", "was"], ["will", "is", "going"], ["talks", "tells", "says"], ["Do", "Would", "Will"]], "answer": [["met"], ["got"], ["going"], ["says"], ["Would"]], "vi": "Chào Helen,\nBạn biết gì không! Hôm qua mình tình cờ gặp Pete. Đã lâu lắm rồi kể từ lần cuối bọn mình gặp nhau. Anh ấy kể rằng mình đã kết hôn năm ngoái và vợ hiện đang mang thai. Anh ấy sắp làm bố! Tuyệt quá! Mình rất mừng cho anh ấy. Anh ấy nói cần chuyển nhà vì căn hộ giờ quá nhỏ. Cuối tuần này chúng mình đến thăm họ nhé? Bạn có thích không?\nThân mến,\nJenny", "glossary": [["ran into", "ræn ˈɪntuː", "Met someone by chance.", "tình cờ gặp · quá khứ của run into"], ["married last year", "ˈmærid lɑːst jɪə", "Became married in the previous year, after got.", "kết hôn năm ngoái · get married"], ["going to be", "ˈɡəʊɪŋ tə biː", "Expected to become something.", "sắp trở thành · be going to + động từ"]]}, {"type": "sequence", "title": "Sugar consumption", "start": "This is a report about sugar consumption in children.", "lines": ["This is why this report recommends designing a comprehensive communication campaign.", "Educators and health authorities have shown great concern over these rates.", "This has resulted in increasing obesity rates in recent years.", "Research indicates that children are taking too much sugar in soft drinks.", "They believe a common effort should be made to get these numbers down."], "answer": [3, 2, 1, 4, 0], "vi": ["Đây là báo cáo về việc tiêu thụ đường ở trẻ em.", "Đó là lý do báo cáo đề xuất xây dựng một chiến dịch truyền thông toàn diện.", "Các nhà giáo dục và cơ quan y tế đã bày tỏ lo ngại lớn về những tỷ lệ này.", "Điều này khiến tỷ lệ béo phì tăng trong những năm gần đây.", "Nghiên cứu cho thấy trẻ em đang hấp thụ quá nhiều đường từ nước ngọt.", "Họ cho rằng cần nỗ lực chung để giảm những con số này."], "glossary": [["sugar consumption", "ˈʃʊɡə kənˈsʌmpʃən", "The amount of sugar people eat or drink.", "lượng đường tiêu thụ"], ["shown great concern", "ʃəʊn ɡreɪt kənˈsɜːn", "Expressed strong worry about something.", "bày tỏ lo ngại lớn"], ["communication campaign", "kəˌmjuːnɪˈkeɪʃən kæmˈpeɪn", "An organised effort to share a message with many people.", "chiến dịch truyền thông"]]}, {"type": "sequence", "title": "Borrowing a book", "start": "If you’d like to borrow a book, please follow these instructions.", "lines": ["You will see that the titles of the books will appear on the screen.", "Follow the same instructions to return them.", "Check that the information is correct and accept.", "Go to the automatic machine by the entrance and swipe your library card.", "Put the books you want to borrow in the container below."], "answer": [3, 4, 0, 2, 1], "vi": ["Nếu muốn mượn sách, hãy làm theo các hướng dẫn này.", "Bạn sẽ thấy tên các cuốn sách xuất hiện trên màn hình.", "Làm theo các bước tương tự để trả sách.", "Kiểm tra thông tin chính xác rồi xác nhận.", "Đến máy tự động gần lối vào và quẹt thẻ thư viện.", "Đặt những cuốn sách muốn mượn vào ngăn phía dưới."], "glossary": [["swipe your library card", "swaɪp jɔː ˈlaɪbrəri kɑːd", "Move your library card through a reader.", "quẹt thẻ thư viện"], ["appear on the screen", "əˈpɪə ɒn ðə skriːn", "Become visible on a display.", "xuất hiện trên màn hình"], ["follow these instructions", "ˈfɒləʊ ðiːz ɪnˈstrʌkʃənz", "Do the steps you are given.", "làm theo những hướng dẫn này"]]}, {"type": "matching", "title": "City life", "texts": ["Living in a big city can be very inspiring, the bigger it is, and the more cosmopolitan, the better. I love living in a big city because I find something interesting to see or hear every time I get out of my flat. There are four different exotic food restaurants round the corner, and shops of every description. You can’t really ever get tired, there’s always something new to do or see. If you are a writer like myself, this kind of environment will definitely inspire you.", "The biggest problem with big cities is the traffic and parking, actually, everything to do with transportation. Because even if you decide not to have a car, you'll find yourself surrounded by buses, taxis, delivery vehicles which will always be in your way. Pedestrians are actually looked down on as if they were inferior creatures. If I could do anything about this, I would ban cars and get everybody on two wheels. It’s even good for your health.", "Finding the job of your dreams is something a city can do for you. Unless of course, your line of work requires being in a quieter area. The amount of different alternatives in the city is just unparalleled. It’s where big companies are, where you can reach thousands in a day. It can be stressful, certainly. However, there are equally varied alternatives for relaxation: art galleries, coffee shops, big parks, not to mention night life.", "I have 3 children. The city has a lot to offer for someone like me, excellent day care centres, schools, different activities and cultural entertainment, everything you need and easy to reach. Though of course, I would love to have a garden where they could play, but you can’t have it all, or so they say. Apart from that, times are changing. Now all children everywhere are continuously on their phones and computers. I guess we need to adapt to the times."], "questions": ["Who says cities can help develop most careers?", "Who finds big cities energising?", "Who values city logistics the most?", "Who says cities offer many ways of chilling out?", "Who really likes bicycles?", "Who feels unwanted in a city?", "Who says big cities are what you need to do a creative job?"], "answer": [["C"], ["A"], ["D"], ["C"], ["B"], ["B"], ["A"]], "vi": ["Sống ở thành phố lớn có thể rất truyền cảm hứng; thành phố càng lớn và càng đa dạng văn hóa càng tốt. Tôi thích sống ở thành phố lớn vì mỗi lần bước ra khỏi căn hộ, tôi đều thấy hoặc nghe điều gì đó thú vị. Quanh góc phố có bốn nhà hàng ẩm thực nước ngoài khác nhau và đủ mọi loại cửa hàng. Bạn thực sự khó thấy chán vì luôn có điều mới để làm hoặc xem. Nếu bạn là nhà văn như tôi, môi trường này chắc chắn sẽ truyền cảm hứng cho bạn.", "Vấn đề lớn nhất của thành phố lớn là giao thông và chỗ đỗ xe; thực ra là mọi thứ liên quan đến đi lại. Bởi dù quyết định không sở hữu ô tô, bạn vẫn thấy mình bị vây quanh bởi xe buýt, taxi và xe giao hàng luôn cản đường. Người đi bộ bị coi thường như thể họ thấp kém hơn. Nếu có thể làm gì đó, tôi sẽ cấm ô tô và để mọi người đi xe hai bánh. Việc đó còn tốt cho sức khỏe.", "Thành phố có thể giúp bạn tìm được công việc mơ ước, trừ khi nghề của bạn đòi hỏi phải ở nơi yên tĩnh hơn. Số lượng lựa chọn khác nhau trong thành phố thật khó nơi nào sánh được. Đó là nơi có các công ty lớn, nơi bạn có thể tiếp cận hàng nghìn người mỗi ngày. Chắc chắn cũng có lúc căng thẳng. Tuy nhiên, các lựa chọn thư giãn cũng đa dạng không kém: phòng trưng bày nghệ thuật, quán cà phê, công viên lớn, chưa kể đời sống về đêm.", "Tôi có ba con. Thành phố đem lại rất nhiều thứ cho người như tôi: nhà trẻ tốt, trường học, các hoạt động và hình thức giải trí văn hóa khác nhau, mọi thứ cần thiết đều dễ tiếp cận. Dĩ nhiên tôi muốn có khu vườn cho các con chơi, nhưng người ta vẫn nói không thể có tất cả. Ngoài ra, thời thế đang thay đổi. Giờ trẻ em ở khắp nơi liên tục dùng điện thoại và máy tính. Tôi đoán chúng ta cần thích nghi với thời đại."], "qvi": ["Ai nói thành phố giúp phát triển phần lớn nghề nghiệp?", "Ai cảm thấy thành phố lớn đem lại năng lượng?", "Ai coi trọng sự thuận tiện của các dịch vụ thành phố nhất?", "Ai nói thành phố có nhiều cách thư giãn?", "Ai thực sự thích xe đạp?", "Ai cảm thấy mình không được chào đón trong thành phố?", "Ai nói thành phố lớn là nơi cần thiết cho công việc sáng tạo?"], "glossary": [["round the corner", "raʊnd ðə ˈkɔːnə", "Very near, around a street corner.", "ngay quanh góc phố"], ["looked down on", "lʊkt daʊn ɒn", "Treated as less important or less valuable.", "bị coi thường · look down on someone"], ["line of work", "laɪn əv wɜːk", "The type of job someone does.", "ngành nghề, lĩnh vực công việc"], ["adapt to", "əˈdæpt tə", "Change to suit a new situation.", "thích nghi với"]]}, {"type": "headings", "title": "Fishing in the Arctic waters?", "texts": ["When you think of fishing, you rarely think of an illegal activity. Images of a peaceful lake or river may come to mind, not naval vessels circling an area with the objective of protecting the environment. The Arctic waters have long been a source of concern as some of the most outstanding marine ecosystems have gradually become the most productive fisheries in the world. Fishing, both as a sport or a livelihood, was never meant to destroy our environment. So the time has come to take action to protect our planet waters as well as our peoples’ economy. The reasons behind illegal fishing should be better understood and prevented, negotiation and compromise should lead the way to everybody and everything wellbeing.", "The Arctic, being particularly affected by climate change, poses a particular problem. Arctic waters are not what they used to be so special attention should be given to them. The once rich animal life raging from zoo plankton to whales and polar bears are increasingly showing signs of the damage perpetrated by rising temperatures and illegal fishing. Should action not be taken soon, we may be facing a situation we may not be able to revert. Some say there are many more seas equally challenged on Earth, and wonder what makes the Arctic waters different. The answer is simple, its uniqueness in animal wild life, which we owe to ourselves and our children to protect.", "Policymakers, the seafood industry, retailers and consumers need to come together in an effort to stop illegal fishing activities. Dealing with climate change is certainly a major challenge, but illegal fishing, which is proven to cause equal stress in the area, is something we can handle if we set our minds and hearts to it. Negotiating fishing practices, improving peoples perception of their share in the fishing outcome, raising awareness among shoppers, working on control regimes, among other measures should lead to a significant decrease in illegal Fishing activity. The reasons for illegal fishing may be assessed and addressed successfully if due commitment from all parties is secured, which should be done as soon as possible.", "Norway, Russia, and the EU have already started working on restoring Arctic water to their former glory. Developments such as the Norwegian-Russian initiative for port state control, where all incoming frozen fish need to be reported before landing will allow proper control via verification from flag state and fishing processes. Russia has moved forward to set quota allocation control systems to sanction companies guilty of illegal fishing. In turn, the EU Commission proposed a number of measures to address illegal fishing activities, including sanctions against EU actors involved, and closing the market to illegal fishing products.", "The World Wide Fund for Nature has shown great concern and commitment to the resolution of this matter by keeping a close eye on causes and results. They have reported progress on several areas and are recommending further action on others, including traceability processes in harvesting, transportation, storage, distribution, processing and marketing in an effort to increase transparency and efficiency in the fight against illegal fishing. Strengthening control areas to ensure markets remain close to illegal fishing products is of the utmost importance. This is not an easy task, as country budget allocations and political decisions need to be agreed upon for this to become a reality. However, it is steps towards practical resolutions what will help us to secure results.", "International cooperation is fundamental to achieve great results, reason for which, creating a global port state agreement could be a way forward to provide the solutions we need. A global agreement to save and protect endangered areas would be highly beneficial not only to protect our animal species but also, as a step closer to reinstating Arctic water natural environment to what it once was. Expanding bilateral agreements on port control to a global regulation framework would provide each state with the tools to protect their waters from speculation and boundless ambition. The different nations would benefit greatly if mechanisms for sharing information to fight illegal fishing could be analysed, negotiated and agreed upon in the spirit of global natural wellbeing, which is what every people and nation desires and intends.", "We, shoppers and consumers, can help as well, not everything is down to governments and big actors. All of us as individuals need to become aware of the dangers of giving into the frustrating thought that somebody else will deal with these matters. Whenever we buy fish, we should make sure all certifications needed are in place to determine the source of the product and fishing practices are in line with protective regulations and our own expectations for our planet preservation. Working together, each of us playing a role, we will succeed in restoring the Arctic waters to their former environmental wonder."], "options": ["An international guardian", "We can’t look away", "A global treaty", "What is fishing for you?", "Steps already being taken by some", "Nothing can be done against it", "Why do we care?", "What is to be done?"], "answer": [3, 6, 7, 4, 0, 2, 1], "vi": ["Khi nghĩ đến đánh cá, bạn hiếm khi nghĩ đến hoạt động bất hợp pháp. Hình ảnh hiện ra có thể là hồ nước hay dòng sông yên bình, chứ không phải tàu hải quân tuần tra để bảo vệ môi trường. Vùng biển Bắc Cực từ lâu đã gây lo ngại khi một số hệ sinh thái biển nổi bật nhất dần trở thành những ngư trường năng suất cao nhất thế giới. Đánh cá, dù là thể thao hay sinh kế, vốn không nhằm phá hủy môi trường. Vì vậy, đã đến lúc hành động bảo vệ các vùng nước của hành tinh cũng như nền kinh tế của con người. Cần hiểu rõ hơn và ngăn chặn các nguyên nhân dẫn đến đánh bắt trái phép; đàm phán và thỏa hiệp nên mở đường cho lợi ích chung của mọi người và mọi vật.", "Bắc Cực, nơi chịu ảnh hưởng đặc biệt của biến đổi khí hậu, đặt ra một vấn đề riêng. Các vùng nước nơi đây không còn như trước nên cần được quan tâm đặc biệt. Đời sống động vật từng phong phú, từ động vật phù du đến cá voi và gấu Bắc Cực, ngày càng cho thấy dấu hiệu tổn hại do nhiệt độ tăng và đánh bắt trái phép. Nếu không sớm hành động, chúng ta có thể đối mặt với tình trạng không thể đảo ngược. Có người nói nhiều vùng biển khác trên Trái Đất cũng gặp khó khăn tương tự và hỏi điều gì khiến Bắc Cực khác biệt. Câu trả lời đơn giản là tính độc đáo của động vật hoang dã nơi đây, thứ chúng ta có trách nhiệm bảo vệ cho bản thân và con cháu.", "Các nhà hoạch định chính sách, ngành thủy sản, nhà bán lẻ và người tiêu dùng cần hợp tác để chấm dứt đánh bắt trái phép. Đối phó biến đổi khí hậu chắc chắn là thách thức lớn, nhưng đánh bắt trái phép, vốn được chứng minh gây sức ép tương đương trong khu vực, là điều chúng ta có thể xử lý nếu quyết tâm. Đàm phán về cách thức đánh bắt, cải thiện nhận thức của mọi người về phần lợi ích họ nhận được, nâng cao ý thức người mua, xây dựng cơ chế kiểm soát cùng các biện pháp khác sẽ giúp giảm đáng kể hoạt động này. Có thể đánh giá và giải quyết thành công các nguyên nhân nếu bảo đảm được cam kết thích đáng của mọi bên; điều đó cần được thực hiện càng sớm càng tốt.", "Na Uy, Nga và Liên minh châu Âu đã bắt đầu nỗ lực khôi phục vùng biển Bắc Cực về trạng thái tốt đẹp trước đây. Những bước tiến như sáng kiến Na Uy–Nga về kiểm soát của quốc gia có cảng, yêu cầu khai báo toàn bộ cá đông lạnh nhập vào trước khi dỡ hàng, sẽ hỗ trợ kiểm soát thông qua xác minh từ quốc gia tàu mang cờ và quy trình đánh bắt. Nga đã tiến tới thiết lập hệ thống kiểm soát phân bổ hạn ngạch để xử phạt công ty đánh bắt trái phép. Về phần mình, Ủy ban châu Âu đề xuất các biện pháp xử lý, gồm trừng phạt các chủ thể EU có liên quan và đóng cửa thị trường đối với sản phẩm đánh bắt bất hợp pháp.", "Quỹ Quốc tế Bảo vệ Thiên nhiên thể hiện sự quan tâm và cam kết lớn trong việc giải quyết vấn đề bằng cách theo dõi sát nguyên nhân và kết quả. Tổ chức đã báo cáo tiến bộ ở một số lĩnh vực và đề xuất hành động tiếp ở những lĩnh vực khác, gồm truy xuất nguồn gốc trong khai thác, vận chuyển, lưu trữ, phân phối, chế biến và tiếp thị, nhằm tăng tính minh bạch và hiệu quả chống đánh bắt trái phép. Tăng cường kiểm soát để thị trường không tiếp nhận sản phẩm bất hợp pháp là điều vô cùng quan trọng. Đây không phải việc dễ, vì cần thống nhất phân bổ ngân sách quốc gia và các quyết định chính trị. Tuy nhiên, chính những bước tiến hướng đến giải pháp thực tế sẽ giúp bảo đảm kết quả.", "Hợp tác quốc tế là nền tảng để đạt kết quả lớn; vì vậy, xây dựng một thỏa thuận toàn cầu về quốc gia có cảng có thể là hướng đi giúp đem lại giải pháp cần thiết. Thỏa thuận toàn cầu cứu và bảo vệ những khu vực bị đe dọa không chỉ có lợi cho các loài động vật mà còn đưa chúng ta đến gần việc phục hồi môi trường tự nhiên Bắc Cực như trước. Mở rộng thỏa thuận song phương về kiểm soát cảng thành khung quy định toàn cầu sẽ cung cấp công cụ để từng quốc gia bảo vệ vùng biển trước đầu cơ và tham vọng không giới hạn. Các nước sẽ được lợi nhiều nếu cơ chế chia sẻ thông tin chống đánh bắt trái phép được phân tích, đàm phán và thống nhất trên tinh thần vì sức khỏe thiên nhiên toàn cầu, điều mọi dân tộc và quốc gia đều mong muốn.", "Chúng ta, những người mua hàng và tiêu dùng, cũng có thể giúp đỡ; không phải mọi việc đều do chính phủ và các tổ chức lớn quyết định. Mỗi cá nhân cần nhận ra nguy cơ của suy nghĩ buông xuôi rằng người khác sẽ giải quyết vấn đề. Mỗi khi mua cá, chúng ta nên bảo đảm có đủ chứng nhận cần thiết để xác định nguồn gốc sản phẩm và cách đánh bắt phù hợp với quy định bảo vệ cũng như kỳ vọng của mình về bảo tồn hành tinh. Cùng hợp tác, mỗi người góp phần, chúng ta sẽ thành công trong việc khôi phục vùng biển Bắc Cực về vẻ kỳ diệu tự nhiên trước đây."], "glossary": [["take action", "teɪk ˈækʃən", "Do something to deal with a problem.", "hành động để giải quyết vấn đề"], ["raising awareness", "ˈreɪzɪŋ əˈweənəs", "Helping people understand an issue.", "nâng cao nhận thức"], ["keeping a close eye on", "ˈkiːpɪŋ ə kləʊs aɪ ɒn", "Watching something carefully.", "theo dõi sát"], ["of the utmost importance", "əv ði ˈʌtməʊst ɪmˈpɔːtəns", "Extremely important.", "vô cùng quan trọng"], ["international cooperation", "ˌɪntəˈnæʃənəl kəʊˌɒpəˈreɪʃən", "Countries working together.", "hợp tác quốc tế"]], "ovi": ["Người bảo vệ quốc tế", "Chúng ta không thể làm ngơ", "Hiệp ước toàn cầu", "Đánh cá có ý nghĩa gì với bạn?", "Những bước đi đã được một số bên thực hiện", "Không thể làm gì để ngăn chặn", "Vì sao chúng ta quan tâm?", "Cần phải làm gì?"]}]}, {"title": "Test 3", "pages": "86–90", "parts": [{"type": "gap", "title": "A photography course", "text": "Hi John,\nI’ve been thinking of writing to you all week and now I find the time.\nDo you remember I {0} you I’ve always wanted to be a photographer? Well, I found a course {1} the street which seems very interesting! They talk about {2}, focus, frame, zooming. I wonder if you’d like to join me! It is on Mondays at six o’clock. I think we could {3} after work and go together.\nLet me know {4} you think.\nCheers!\nDan", "options": [["told", "said", "asked"], ["on", "across", "behind"], ["life", "job", "light"], ["find", "see", "meet"], ["that", "which", "what"]], "answer": [["told"], ["across"], ["light"], ["meet"], ["what"]], "vi": "Chào John,\nMình định viết cho bạn suốt cả tuần và giờ mới có thời gian. Bạn có nhớ mình từng nói luôn muốn trở thành nhiếp ảnh gia không? Mình tìm được một khóa học ở bên kia đường, có vẻ rất thú vị! Họ nói về ánh sáng, lấy nét, bố cục khung hình và thu phóng. Không biết bạn có muốn tham gia cùng mình không! Lớp học vào thứ Hai lúc sáu giờ. Mình nghĩ chúng ta có thể gặp nhau sau giờ làm rồi đi cùng.\nHãy cho mình biết bạn nghĩ sao nhé.\nThân mến!\nDan", "glossary": [["find the time", "faɪnd ðə taɪm", "Manage to have enough time for something.", "thu xếp được thời gian"], ["across the street", "əˈkrɒs ðə striːt", "On the other side of the road.", "ở bên kia đường"], ["let me know", "let mi nəʊ", "Tell me or give me information.", "hãy cho tôi biết"]]}, {"type": "sequence", "title": "Checking in at the airport", "start": "If you fail to check in online, please follow these instructions.", "lines": ["He will ask you if you want to check in any luggage as well.", "Give your name and hand your passport to the check-in agent.", "Go to your airline check-in desk at the airport two hours before departure.", "You will then be given your boarding pass with your luggage receipt attached.", "If your luggage weighs more than what you paid for when booking, you will be charged extra."], "answer": [2, 1, 0, 4, 3], "vi": ["Nếu không làm thủ tục trực tuyến được, hãy làm theo các hướng dẫn sau.", "Nhân viên sẽ hỏi bạn có muốn ký gửi hành lý không.", "Cho biết tên và đưa hộ chiếu cho nhân viên làm thủ tục.", "Đến quầy làm thủ tục của hãng ở sân bay hai tiếng trước giờ khởi hành.", "Sau đó, bạn sẽ được cấp thẻ lên máy bay có đính kèm biên nhận hành lý.", "Nếu hành lý nặng hơn mức đã trả tiền khi đặt vé, bạn sẽ phải trả thêm phí."], "glossary": [["check-in desk", "ˈtʃek ɪn desk", "The airport counter where passengers register.", "quầy làm thủ tục"], ["boarding pass", "ˈbɔːdɪŋ pɑːs", "The document that allows you to get on a plane.", "thẻ lên máy bay"], ["charged extra", "tʃɑːdʒd ˈekstrə", "Asked to pay an additional amount.", "bị tính thêm phí"]]}, {"type": "sequence", "title": "Protecting wildlife", "start": "This report shows the dramatic decline in natural wildlife in the area.", "lines": ["Many take their motorcycles into the woods, driving animals away and destroying plants.", "With this simple measure, we are convinced our natural life can gradually be restored.", "If the tracks are properly signposted, tourists will be able to follow them easily.", "Tourist numbers increase every year and no measures have been taken to minimise their impact.", "Proper walking and driving tracks and paths need to be designed to preserve nature."], "answer": [3, 0, 4, 2, 1], "vi": ["Báo cáo này cho thấy sự suy giảm mạnh của động vật hoang dã trong khu vực.", "Nhiều người đi xe máy vào rừng, xua đuổi động vật và phá hủy cây cối.", "Với biện pháp đơn giản này, chúng tôi tin rằng hệ sinh thái tự nhiên có thể dần được phục hồi.", "Nếu các tuyến đường được cắm biển chỉ dẫn đúng cách, du khách sẽ dễ dàng đi theo.", "Lượng khách du lịch tăng hằng năm nhưng chưa có biện pháp nào nhằm giảm thiểu tác động của họ.", "Cần thiết kế đường đi bộ và đường dành cho xe phù hợp để bảo tồn thiên nhiên."], "glossary": [["dramatic decline", "drəˈmætɪk dɪˈklaɪn", "A very large decrease.", "sự suy giảm mạnh"], ["minimise their impact", "ˈmɪnɪmaɪz ðeər ˈɪmpækt", "Reduce their effects as much as possible.", "giảm thiểu tác động của họ"], ["preserve nature", "prɪˈzɜːv ˈneɪtʃə", "Protect the natural world from damage.", "bảo tồn thiên nhiên"]]}, {"type": "matching", "title": "Volunteering", "texts": ["I’ve worked in a big multinational for 7 years, and I join a volunteering scheme every year. Last year we helped renovate a senior centre, and it was just great. It helps the people there. You see the value of your effort immediately. But also, it helps build a good team at your work place. You get closely together with people from other departments doing something that matters. It helps you build stronger relationships compared to, let’s say, going out for lunch, for example.", "I don’t really see the benefits of this volunteering spree. All young people are now thinking of is going abroad, travelling the world. I don’t believe they are taking the effort people like Doctors without Borders are doing seriously. They are just going along so that they can travel and get their expenses covered. Don’t get me wrong, I think people should travel, but when they retire, not when they are young, and should be starting to work.", "I worked for years in a big laboratory, and I felt empty, as if my work had no value. My boss appreciated what I did, but I felt I could do much more. So, I left my job and started working for a Charity. I get very little pay now, but the work we do is my reward. We help vulnerable single mothers who need medical assistance. You can’t put a price on the feeling of doing what’s right. Helping others, you help yourself.", "I think volunteering should be mandatory for teenagers. It would help them get a better picture of society, and the contribution they can make to it. They are online most of the time and I think they don’t get to see much of the sadness around us nowadays. When many of them finish school, they don’t know what to do with their lives. I think that having an understanding of what society needs can help them design their future."], "questions": ["Who would make volunteering compulsory?", "Who thinks young people shouldn’t waste their time volunteering?", "Who thinks volunteering can help you make a better work environment?", "Who thinks not everybody appreciates the true value of volunteering?", "Who didn’t feel fulfilled before?", "Who doesn’t think your salary should be an issue when choosing your job?", "Who thinks volunteering can help you decide your future career path?"], "answer": [["D"], ["B"], ["A"], ["B"], ["C"], ["C"], ["D"]], "vi": ["Tôi đã làm ở một công ty đa quốc gia lớn được bảy năm và năm nào cũng tham gia một chương trình tình nguyện. Năm ngoái, chúng tôi giúp sửa sang một trung tâm dành cho người cao tuổi và trải nghiệm đó thật tuyệt. Việc này giúp ích cho những người ở đó. Bạn thấy ngay giá trị nỗ lực của mình. Nó còn giúp xây dựng một đội ngũ tốt tại nơi làm việc. Bạn trở nên gần gũi với người ở các bộ phận khác khi cùng làm việc có ý nghĩa. Điều này giúp xây dựng quan hệ bền chặt hơn so với việc, chẳng hạn, cùng ra ngoài ăn trưa.", "Tôi không thực sự thấy lợi ích của phong trào tình nguyện rầm rộ này. Giới trẻ hiện chỉ nghĩ đến việc ra nước ngoài và đi khắp thế giới. Tôi không tin họ thật sự coi trọng nỗ lực của những người như tổ chức Bác sĩ Không Biên giới. Họ chỉ tham gia để được đi du lịch và được chi trả chi phí. Đừng hiểu lầm tôi: tôi nghĩ mọi người nên đi du lịch, nhưng là khi nghỉ hưu, chứ không phải khi còn trẻ và đáng lẽ nên bắt đầu đi làm.", "Tôi đã làm việc nhiều năm trong một phòng thí nghiệm lớn và cảm thấy trống rỗng, như thể công việc chẳng có giá trị. Sếp đánh giá cao việc tôi làm, nhưng tôi cảm thấy mình có thể làm nhiều hơn nữa. Vì vậy, tôi nghỉ việc và bắt đầu làm cho một tổ chức từ thiện. Giờ lương rất thấp, nhưng chính công việc là phần thưởng của tôi. Chúng tôi giúp những bà mẹ đơn thân dễ bị tổn thương cần hỗ trợ y tế. Không thể định giá cảm giác được làm điều đúng đắn. Giúp người khác cũng là giúp chính mình.", "Tôi nghĩ hoạt động tình nguyện nên là bắt buộc đối với thanh thiếu niên. Nó sẽ giúp các em hiểu rõ hơn về xã hội và những đóng góp mình có thể thực hiện. Các em dành phần lớn thời gian trên mạng, và tôi nghĩ các em không thấy nhiều nỗi buồn quanh chúng ta hiện nay. Nhiều em khi học xong không biết nên làm gì với cuộc đời. Tôi nghĩ hiểu được xã hội cần gì sẽ giúp các em định hướng tương lai."], "qvi": ["Ai muốn hoạt động tình nguyện trở thành bắt buộc?", "Ai nghĩ người trẻ không nên lãng phí thời gian làm tình nguyện?", "Ai nghĩ tình nguyện giúp cải thiện môi trường làm việc?", "Ai nghĩ không phải ai cũng hiểu đúng giá trị của tình nguyện?", "Ai từng không cảm thấy mãn nguyện?", "Ai cho rằng tiền lương không nên là vấn đề khi chọn việc?", "Ai nghĩ tình nguyện giúp định hướng nghề nghiệp tương lai?"], "glossary": [["build stronger relationships", "bɪld ˈstrɒŋɡə rɪˈleɪʃənʃɪps", "Develop closer connections with people.", "xây dựng các mối quan hệ bền chặt hơn"], ["expenses covered", "ɪkˈspensɪz ˈkʌvəd", "Costs paid by someone else.", "được chi trả chi phí"], ["put a price on", "pʊt ə praɪs ɒn", "Decide how much money something is worth.", "định giá · không thể định giá cảm xúc trong ngữ cảnh này"], ["make a contribution", "meɪk ə ˌkɒntrɪˈbjuːʃən", "Do something that helps a group or cause.", "đóng góp · make a contribution to"]]}, {"type": "headings", "title": "Do we need robots?", "texts": ["The word “Robot” first appeared in a play by Karel Capek called R.U.R., or Rossum’s Universal Robots and stayed in our lives as deadly non-human characters in literature for a long time. It wasn’t until the 1960s when a truly so called robot was developed according to our definition of a robot. The SRI International in Silicon Valley developed Shakey, a completely mobile and perceptive robot, which could be described as a Robot, which is an intelligent, physically embodied machine which can perform tasks autonomously to some degree and which can sense and manipulate its environment.", "The definition is indeed very broad, and many are the variations and interpretations. In a general sense of the word, a drone people can fly around isn’t a robot. Although if it was properly equipped with the power of taking off and landing on its own, and of sensing objects, it would then be turned into a robot. The key lays in the robot being intelligence, autonomy and sensing. Shakey, our first robot, for example, could navigate an intrinsic environment. It wasn’t as reliable as you might expect, but it was the onset of what was the future of robotics.", "It is in the manufacturing industry where we can see the wonderful benefits of this technology. The first one among them is Unimate, which works non-stop in car factories doing tasks which are both boring and dangerous for human co-workers. These robots have shown more accuracy and speed than ever achieved by us humans at the same tasks, Even though this first one wasn’t mobile, as it was fixed on a spot. It is widely considered to be a robot as it senses and manipulates its surroundings.", "Sensors, as we can see, make all the difference. It’s a devise which shoots out lasers to build a mind map of its surroundings to allow the robot to operate on them. Sensors like Lidar were what made it possible for the 2004 Darpa Grand Challenge to watch self-driving cars race through the desert for everybody’s amazement. The increasing production of these sensors has helped the private-sector to develop multiple perceptive robots thanks to its growing competitive prices.", "Contrary to literature and movie characterisation of robots, new robot technologies promise not to kill us, but to make our lives safer and more comfortable. It will be harder and harder to have a car accident in the future, as cars will be equipped with movement sensors able to stop the car for us when danger approaches. They will be able to see where we can’t, around corners, spots the human eye can’t reach ,and prevent accidents otherwise inevitable. Not only are they safer, robots are getting smarter too. Driverless vehicles have already started to be tested and promise a future of driving without a license.", "Where does it stop? Will robots replace us? Even though the range of human emotions is hard to simulate through technology, a company called SynTouch has developed robotic fingerprints which can detect a range of sensations, from temperature to coarseness. Columbia University has created a robot able to replicate touch with light, so to say, it sees touch thanks to a series of embedded LED lights, covered with a silicone layer. The physical changes in this layer allow the robot to “see” touch.", "The problem roboticists now face to make robots the ultimate success is to provide them with autonomy. It is quite unthinkable for developers to have to program software for every inch of every house, company, factory or city for robots to move about safely. There is a need for robots to self map their environment and make decisions themselves. Robots need to learn and map surfaces on their own. Artificial Intelligence is the big answer to this conundrum. Brett, a UC Berkeley lab robot, has taught itself to put puzzles together. It did it by trial and error. And it is the key for our futuristic robotic days to come."], "options": ["Are robots truly safe?", "A future in robotics", "No robots for me, thanks", "Can robots feel like a human?", "Where does the word robot come from?", "A key component", "What is a robot?", "Robots at work"], "answer": [4, 6, 7, 5, 0, 3, 1], "vi": ["Từ “robot” xuất hiện lần đầu trong vở kịch R.U.R., hay Những robot vạn năng của Rossum, của Karel Čapek, rồi hiện diện lâu dài trong văn học dưới hình tượng nhân vật phi nhân loại chết chóc. Mãi đến thập niên 1960 mới xuất hiện robot thực sự theo định nghĩa của chúng ta. SRI International tại Thung lũng Silicon phát triển Shakey, một robot có khả năng di chuyển và cảm nhận môi trường. Có thể mô tả robot là một cỗ máy thông minh có hình thể vật lý, thực hiện nhiệm vụ tự chủ ở mức độ nhất định, đồng thời cảm nhận và tác động lên môi trường xung quanh.", "Định nghĩa này quả thực rất rộng, với nhiều biến thể và cách hiểu. Theo nghĩa chung, thiết bị bay không người lái do con người điều khiển không phải robot. Tuy nhiên, nếu được trang bị khả năng tự cất cánh, hạ cánh và cảm nhận vật thể, nó sẽ trở thành robot. Điểm mấu chốt là trí thông minh, tính tự chủ và khả năng cảm nhận. Chẳng hạn, Shakey, robot đầu tiên được nhắc đến ở đây, có thể di chuyển trong môi trường phức tạp. Nó không đáng tin cậy như bạn kỳ vọng, nhưng đánh dấu sự khởi đầu cho tương lai của ngành robot.", "Chính trong ngành sản xuất, chúng ta thấy được những lợi ích tuyệt vời của công nghệ này. Một robot tiên phong là Unimate, làm việc liên tục trong nhà máy ô tô, thực hiện nhiệm vụ vừa nhàm chán vừa nguy hiểm đối với đồng nghiệp con người. Những robot này đạt độ chính xác và tốc độ cao hơn con người từng đạt được trong cùng nhiệm vụ. Dù robot đầu tiên này không di chuyển được vì được cố định tại một chỗ, nó vẫn được công nhận rộng rãi là robot do có khả năng cảm nhận và tác động lên môi trường xung quanh.", "Như chúng ta thấy, cảm biến tạo nên sự khác biệt lớn. Đây là thiết bị phát tia laser để xây dựng bản đồ môi trường xung quanh, cho phép robot hoạt động trong đó. Những cảm biến như Lidar giúp cuộc thi DARPA Grand Challenge năm 2004 chứng kiến xe tự lái đua qua sa mạc, khiến mọi người kinh ngạc. Việc tăng sản lượng cảm biến đã giúp khu vực tư nhân phát triển nhiều robot có khả năng cảm nhận nhờ mức giá ngày càng cạnh tranh.", "Trái với hình tượng robot trong văn học và điện ảnh, công nghệ robot mới hứa hẹn làm cuộc sống an toàn, thoải mái hơn thay vì giết hại chúng ta. Trong tương lai, tai nạn ô tô sẽ khó xảy ra hơn khi xe có cảm biến chuyển động giúp tự dừng lúc nguy hiểm đến gần. Chúng có thể nhìn thấy nơi con người không thấy, như quanh góc khuất hay điểm ngoài tầm mắt, và ngăn tai nạn vốn không tránh được. Robot không chỉ an toàn hơn mà còn thông minh hơn. Xe không người lái đã bắt đầu được thử nghiệm, hứa hẹn tương lai di chuyển không cần bằng lái.", "Điều này sẽ dừng ở đâu? Robot có thay thế chúng ta không? Dù khó mô phỏng đầy đủ cảm xúc con người bằng công nghệ, công ty SynTouch đã phát triển bộ phận xúc giác robot có thể phát hiện nhiều cảm giác, từ nhiệt độ đến độ thô ráp. Đại học Columbia tạo ra robot có thể tái hiện xúc giác bằng ánh sáng; nói cách khác, nó nhìn thấy sự tiếp xúc nhờ một chuỗi đèn LED tích hợp được phủ lớp silicone. Những thay đổi vật lý trong lớp này cho phép robot “nhìn thấy” tiếp xúc.", "Vấn đề các nhà nghiên cứu robot hiện đối mặt để đưa robot đến thành công tối đa là cung cấp tính tự chủ. Thật khó tưởng tượng nhà phát triển phải lập trình phần mềm cho từng góc nhỏ của mọi ngôi nhà, công ty, nhà máy hay thành phố để robot đi lại an toàn. Robot cần tự lập bản đồ môi trường và đưa ra quyết định. Chúng phải tự học và lập bản đồ các bề mặt. Trí tuệ nhân tạo là lời giải lớn cho bài toán này. Brett, robot trong phòng thí nghiệm UC Berkeley, đã tự học ghép các mảnh hình bằng thử và sai. Đó là chìa khóa cho tương lai robot phía trước."], "glossary": [["perform tasks", "pəˈfɔːm tɑːsks", "Carry out pieces of work.", "thực hiện nhiệm vụ"], ["manufacturing industry", "ˌmænjʊˈfæktʃərɪŋ ˈɪndəstri", "Businesses that make products in factories.", "ngành công nghiệp sản xuất"], ["make all the difference", "meɪk ɔːl ðə ˈdɪfrəns", "Have a very important effect on the result.", "tạo ra sự khác biệt quyết định"], ["artificial intelligence", "ˌɑːtɪfɪʃəl ɪnˈtelɪdʒəns", "Computer systems able to do tasks that need intelligence.", "trí tuệ nhân tạo"], ["trial and error", "ˌtraɪəl ən ˈerə", "Trying different methods and learning from mistakes.", "phương pháp thử và sai"]], "ovi": ["Robot có thực sự an toàn?", "Tương lai của ngành robot", "Tôi không muốn dùng robot, cảm ơn", "Robot có thể cảm nhận như người không?", "Từ robot bắt nguồn từ đâu?", "Một bộ phận then chốt", "Robot là gì?", "Robot tại nơi làm việc"]}]}, {"title": "Test 4", "pages": "91–95", "parts": [{"type": "gap", "title": "A farewell party", "text": "Dear Jenny,\nHow are you? I’m writing to you because I have an idea. You know that Gene is going to {0} with a charity for a year. He’s {1} for Africa next month. I was thinking we could {2} him a farewell party. Do you like the idea? If you do, where do you think we {3} do it? Any thoughts?\n{4} Peter, I think it should be outdoors. What about a barbecue somewhere?\nLet me know what you think.\nBye for now,\nSusan", "options": [["volunteer", "make", "meet"], ["travelling", "leaving", "moving"], ["give", "make", "throw"], ["will", "able", "could"], ["According", "Knowing", "Thinking"]], "answer": [["volunteer"], ["leaving"], ["throw", "give"], ["could", "will"], ["Knowing"]], "vi": "Jenny thân mến,\nBạn khỏe không? Mình viết thư vì có một ý tưởng. Bạn biết Gene sắp làm tình nguyện cho một tổ chức từ thiện trong một năm đấy. Tháng sau anh ấy sẽ lên đường sang châu Phi. Mình nghĩ chúng ta có thể tổ chức tiệc chia tay cho anh ấy. Bạn có thích ý tưởng này không? Nếu thích, bạn nghĩ chúng ta có thể tổ chức ở đâu? Bạn có ý kiến gì không?\nVì hiểu tính Peter, mình nghĩ nên tổ chức ngoài trời. Hay làm tiệc nướng ở đâu đó nhé?\nHãy cho mình biết bạn nghĩ sao.\nChào nhé,\nSusan", "glossary": [["volunteer with a charity", "ˌvɒlənˈtɪə wɪð ə ˈtʃærəti", "Offer unpaid help to a charity.", "làm tình nguyện cho tổ chức từ thiện"], ["leaving for", "ˈliːvɪŋ fə", "Going away to a destination.", "lên đường đến · leave for + nơi đến"], ["farewell party", "ˌfeəˈwel ˈpɑːti", "A party for someone who is leaving.", "tiệc chia tay · throw/give someone a farewell party"]], "notes": {"2": "Both “throw him a farewell party” and “give him a farewell party” are natural.", "3": "“Could” asks about a possible venue; “will” asks where the party is expected to take place. Both are grammatical here."}, "notesvi": {"2": "Cả throw him a farewell party và give him a farewell party đều tự nhiên.", "3": "Could hỏi về địa điểm có thể tổ chức; will hỏi địa điểm dự kiến. Cả hai đều đúng ngữ pháp ở đây."}}, {"type": "sequence", "title": "Boarding your flight", "start": "Please follow these instructions to board your flight.", "lines": ["If the boarding agents indicate it, measure your bag where specified.", "On arrival at the airport, head to the departure area.", "You will have to pay extra if your luggage is oversized before boarding the plane.", "Please check your flight boarding gate on the electronic displays, and find your gate.", "Find your assigned group on your boarding pass and queue under your boarding group sign."], "answer": [1, 3, 4, 0, 2], "vi": ["Hãy làm theo các hướng dẫn sau để lên máy bay.", "Nếu nhân viên cửa lên máy bay yêu cầu, hãy đo túi tại nơi quy định.", "Khi đến sân bay, đi về phía khu khởi hành.", "Bạn sẽ phải trả thêm phí trước khi lên máy bay nếu hành lý quá kích thước.", "Kiểm tra cửa lên máy bay trên bảng điện tử rồi tìm đến cửa đó.", "Tìm nhóm lên máy bay được chỉ định trên thẻ và xếp hàng dưới biển của nhóm đó."], "glossary": [["departure area", "dɪˈpɑːtʃə ˈeəriə", "The airport area used by departing passengers.", "khu khởi hành"], ["boarding gate", "ˈbɔːdɪŋ ɡeɪt", "The place where you enter the plane.", "cửa lên máy bay"], ["pay extra", "peɪ ˈekstrə", "Pay more than the usual or original amount.", "trả thêm tiền"]]}, {"type": "sequence", "title": "At the bakery", "start": "Yesterday, I went to the bakery to buy Sunday pastry as usual.", "lines": ["As soon as I got in, I saw a man outside, leaving his bike parked by the door.", "When it was my turn, I started ordering. But suddenly, something happened.", "The man speedily chased him on foot, and caught him at the corner.", "He didn’t chain it, and came in quickly. He was tall and robust.", "A teenager came out of nowhere, took the bike, and left pedalling."], "answer": [0, 3, 1, 4, 2], "vi": ["Hôm qua, tôi đến tiệm bánh mua bánh ngọt ngày Chủ nhật như thường lệ.", "Vừa bước vào, tôi thấy một người đàn ông bên ngoài để xe đạp cạnh cửa.", "Đến lượt mình, tôi bắt đầu gọi món. Nhưng đột nhiên có chuyện xảy ra.", "Người đàn ông nhanh chóng chạy bộ đuổi theo và bắt được cậu ta ở góc đường.", "Ông ấy không khóa xe mà nhanh chóng đi vào. Ông cao lớn, vạm vỡ.", "Một thiếu niên từ đâu xuất hiện, lấy xe rồi đạp đi."], "glossary": [["as usual", "əz ˈjuːʒuəl", "In the way that normally happens.", "như thường lệ"], ["my turn", "maɪ tɜːn", "The time when I am next to do something.", "đến lượt tôi · when it was my turn"], ["out of nowhere", "aʊt əv ˈnəʊweə", "Suddenly, without being noticed before.", "bất ngờ xuất hiện từ đâu đó"]]}, {"type": "matching", "title": "Career choice", "texts": ["Nowadays, there’s a lot of pressure on young people to know what their dreams are and to succeed in realising them. When I finished school, I didn’t really know what I wanted to study at university. I started studying law, but soon realised it wasn’t what I expected. So, I dropped out, and turned to graphic design. It’s been the best choice I could’ve made. I think people should be given time to learn about themselves and what they want to become.", "The sooner you know what you want, the faster and better you can get your goals. We are living in a very competitive world and lagging behind isn’t going to help anybody. I knew I wanted to be a mechanical engineer ever since my father bought a new car when I was 15. I was amazed by its engine and workings. I made up my mind to learn everything I could, and now I’m very successful.", "I think life is about getting as many experiences as you can, maybe by combining travelling and taking some summer jobs. After that, you will be able to decide what you want to make a commitment to. Once you've taken a couple of years off to see what the world has to offer, you will be able to make the right choice and devote yourself to it for many years. Your motivation will come from the fact that you will know what you want and why you want it.", "I don’t think there is a real choice as to what to study or where to work. Globalisation and economic factors are changing the global economy now more than ever before. So when choosing your career plan, you need to make sure it will actually help you get a job in the future. Jobs guaranteeing an income today may not guarantee an income tomorrow. You need to evaluate the changes in the work place and make a smart decision."], "questions": ["Who thinks jobs will change in the future?", "Who thinks starting early can give you an advantage?", "Who thinks taking your time is of the essence when deciding a career path?", "Who is driven by having made the right choice after careful evaluation?", "Who thinks forcing young people to choose too soon is wrong?", "Who thinks you can’t really make a free career choice?", "Who thinks you learn by working and going abroad?"], "answer": [["D"], ["B"], ["C", "A"], ["C"], ["A"], ["D"], ["C"]], "vi": ["Ngày nay, người trẻ chịu rất nhiều áp lực phải biết ước mơ của mình là gì và thành công trong việc biến nó thành hiện thực. Khi học xong phổ thông, tôi không thực sự biết mình muốn học ngành gì ở đại học. Tôi bắt đầu học luật nhưng sớm nhận ra đó không phải điều mình kỳ vọng. Vì vậy, tôi bỏ học ngành đó và chuyển sang thiết kế đồ họa. Đó là lựa chọn tốt nhất tôi có thể thực hiện. Tôi nghĩ mọi người cần được dành thời gian để hiểu bản thân và điều mình muốn trở thành.", "Bạn càng sớm biết mình muốn gì thì càng nhanh và thuận lợi đạt mục tiêu. Chúng ta đang sống trong thế giới rất cạnh tranh và tụt lại phía sau không giúp ích cho ai. Tôi biết mình muốn trở thành kỹ sư cơ khí từ khi bố mua ô tô mới lúc tôi 15 tuổi. Tôi kinh ngạc trước động cơ và cơ chế hoạt động của nó. Tôi quyết tâm học mọi thứ có thể và giờ tôi rất thành công.", "Tôi nghĩ cuộc sống là tích lũy càng nhiều trải nghiệm càng tốt, có thể bằng cách kết hợp đi du lịch với làm các công việc mùa hè. Sau đó, bạn sẽ quyết định được điều mình muốn gắn bó. Khi đã dành vài năm nghỉ để khám phá thế giới có gì, bạn sẽ có thể lựa chọn đúng và cống hiến cho lựa chọn ấy nhiều năm. Động lực sẽ đến từ việc bạn biết mình muốn gì và vì sao muốn điều đó.", "Tôi không nghĩ chúng ta thực sự được tự do lựa chọn học gì hay làm ở đâu. Toàn cầu hóa và các yếu tố kinh tế đang thay đổi nền kinh tế thế giới mạnh hơn bao giờ hết. Vì vậy, khi lập kế hoạch nghề nghiệp, bạn cần bảo đảm nó thực sự giúp mình có việc làm trong tương lai. Những công việc bảo đảm thu nhập hôm nay có thể không bảo đảm thu nhập ngày mai. Bạn cần đánh giá các thay đổi ở nơi làm việc và đưa ra quyết định sáng suốt."], "qvi": ["Ai nghĩ công việc sẽ thay đổi trong tương lai?", "Ai nghĩ bắt đầu sớm mang lại lợi thế?", "Ai nghĩ dành đủ thời gian là điều thiết yếu khi chọn nghề?", "Ai có động lực nhờ lựa chọn đúng sau khi cân nhắc kỹ?", "Ai nghĩ ép người trẻ lựa chọn quá sớm là sai?", "Ai nghĩ không thể hoàn toàn tự do chọn nghề?", "Ai nghĩ bạn học hỏi qua làm việc và ra nước ngoài?"], "glossary": [["lagging behind", "ˈlæɡɪŋ bɪˈhaɪnd", "Making less progress than others.", "tụt lại phía sau"], ["made up my mind", "meɪd ʌp maɪ maɪnd", "Decided what to do.", "đã quyết định · make up one’s mind"], ["make a commitment", "meɪk ə kəˈmɪtmənt", "Promise to give time and effort to something.", "cam kết gắn bó · make a commitment to"], ["make the right choice", "meɪk ðə raɪt tʃɔɪs", "Choose the most suitable option.", "đưa ra lựa chọn đúng"]], "notes": {"2": "C recommends time to explore before committing; A also explicitly says people should be given time. Both fit the broad wording."}, "notesvi": {"2": "C khuyên dành thời gian trải nghiệm trước khi gắn bó; A cũng nói mọi người cần được dành thời gian. Cả hai đều phù hợp với câu hỏi rộng này."}}, {"type": "headings", "title": "Do you wish there was another you?", "texts": ["Ethics is not the only thing standing on the way of human cloning. Actually, scientists have been able to clone human embryos for seven years now. However, a whole human person is yet to be cloned. No reports have shown even an attempt to do it yet. It seems the problem is not solely ethical but technical. Cloning humans can be dangerous, less effective than wanting to admit, and lacking in a good reason to do it, which leads us to more and more questions as to whether a human clone will actually be a real thing one day.", "As many people know, Dolly was the first mammal cloned successfully from an adult cell. In 1996, scientists figured out how to use the DNA from the egg cell of a Scottish Blackface sheep and replace it with the DNA of a mammary cell from a Finn Dorset sheep. Using a tiny electric shock to fuse the cell, they managed to replicate it. Next, they placed the cells in the uterus of another sheep, and all of a sudden, a clone was in process. Now, could this method be used in humans?", "Dolly's cloning process took 277 attempts to get one clone. Nowadays, cloning mammals generally has a success rate of about 10% to 20%. Better, but still, a basically quite inefficient process. When talking about cloning humans, other concerns need to be addressed. Scientists would need to overcome ethical issues to collect a large amount of donated eggs, and find enough surrogates to replicate them. But even if they succeeded in overcoming the operational challenge, the biggest obstacle would be not to hurt any human in the process.", "Scientists from all over the world have observed that some embryos die before being implanted. Others result in miscarriages. And again, many of those which get to conception, die soon after being born, or suffer severe abnormalities. Evidently, running these risks is not an easy decision to make when dealing with human cloning. Experimenting with animals is still a field to be researched with greater peace of mind. And again, a very good reason should be provided to attempt to do it given the high stakes.", "Many have entertained the idea that cloning could help to keep people alive, or bring people back from the dead. However, cloning would only produce a twin, not a replica, which as is the case in twins, may have different personalities, so the exact same reproduction unit could never be achieved. Cloning someone to take organs is another popular myth. However unethical this is, it is also not necessary, as only a part of the body can be replicated, so cloning a whole human would be rendered a waste.", "Therapeutic cloning is almost identical to reproductive, except the cloned embryo is never implanted in a uterus. Instead, the embryo is cloned for the sole purpose of extracting stem cells. Stem cells have the incredible ability to turn into any other cell in the human body, which means they're great for developing new treatments for disease and have the potential to repair or regenerate tissues and organs. Anyhow, there are a lot of disadvantages with therapeutic cloning too. Even when the process is successful and done, the recipient human organism will most likely reject the intrusion of foreign cells.", "As there are easier ways to create multipurpose cells nowadays, like the pluripotent stem cells. These are cells which have been reprogrammed to be a different type of cell which can be used therapeutically very successfully. This method provides the chance to do almost everything cloning does but safely and reliably with the exception of creating entire living animals, which as we’ve seen is not actually necessary. Therefore, cloning might actually have a bigger impact on movies than in real scientific life. And just because it can be done, doesn't mean it needs to be done."], "options": ["False expectations", "Cloning stopped for ethical reasons", "New technology", "Kinds of cloning for different purposes", "Real reason for not cloning humans", "Weighing the risks", "Science behind cloning Dolly the sheep", "Efficacy is the biggest obstacle", "Giving up all too soon"], "answer": [4, 6, 7, 5, 0, 3, 2], "vi": ["Đạo đức không phải điều duy nhất cản trở nhân bản người. Thực tế, theo bài đọc, các nhà khoa học đã có thể nhân bản phôi người được bảy năm. Tuy nhiên, một con người hoàn chỉnh vẫn chưa được nhân bản. Chưa có báo cáo nào cho thấy đã có ai thử làm điều đó. Vấn đề dường như không chỉ là đạo đức mà còn là kỹ thuật. Nhân bản người có thể nguy hiểm, kém hiệu quả hơn mức người ta muốn thừa nhận, và thiếu lý do thuyết phục để thực hiện; điều này làm nảy sinh thêm nhiều câu hỏi về việc liệu bản sao con người có trở thành hiện thực một ngày nào đó hay không.", "Như nhiều người biết, Dolly là động vật có vú đầu tiên được nhân bản thành công từ tế bào trưởng thành. Năm 1996, các nhà khoa học tìm ra cách thay DNA của tế bào trứng cừu Scottish Blackface bằng DNA từ tế bào tuyến vú cừu Finn Dorset. Dùng một xung điện nhỏ để dung hợp tế bào, họ đã khiến nó nhân lên. Tiếp theo, họ đặt các tế bào vào tử cung một con cừu khác và quá trình tạo bản sao bắt đầu. Liệu phương pháp này có thể áp dụng cho con người không?", "Quá trình nhân bản Dolly cần 277 lần thử mới tạo được một bản sao. Theo bài đọc, nhân bản động vật có vú hiện có tỷ lệ thành công khoảng 10–20%: tốt hơn nhưng về cơ bản vẫn khá kém hiệu quả. Khi nói đến nhân bản người, cần giải quyết những lo ngại khác. Các nhà khoa học phải vượt qua vấn đề đạo đức để thu thập lượng lớn trứng hiến và tìm đủ người mang thai hộ. Tuy nhiên, dù vượt qua thách thức thực hiện, trở ngại lớn nhất vẫn là bảo đảm không làm tổn hại bất kỳ người nào trong quá trình đó.", "Các nhà khoa học khắp thế giới quan sát thấy một số phôi chết trước khi được cấy ghép; những phôi khác dẫn đến sẩy thai. Nhiều trường hợp phát triển tiếp lại chết ngay sau sinh hoặc mắc bất thường nghiêm trọng. Rõ ràng, chấp nhận những nguy cơ này không phải quyết định dễ dàng khi nhân bản người. Thí nghiệm trên động vật vẫn là lĩnh vực có thể nghiên cứu với tâm lý ít lo ngại hơn. Một lần nữa, phải có lý do thật thuyết phục để thử thực hiện khi hậu quả tiềm tàng lớn đến vậy.", "Nhiều người từng nghĩ nhân bản có thể giúp con người sống mãi hoặc đưa người chết trở lại. Tuy nhiên, nó chỉ tạo ra một cá thể giống như người song sinh, không phải bản sao hoàn toàn; như các cặp song sinh, họ có thể khác tính cách nên không thể tái tạo một người y hệt. Nhân bản để lấy nội tạng là một quan niệm sai phổ biến khác. Dù phi đạo đức đến đâu, điều đó cũng không cần thiết vì chỉ một bộ phận cơ thể có thể được tái tạo, khiến việc nhân bản cả con người trở nên lãng phí.", "Nhân bản trị liệu gần giống nhân bản sinh sản, ngoại trừ việc phôi được nhân bản không bao giờ được cấy vào tử cung. Thay vào đó, phôi được tạo chỉ để lấy tế bào gốc. Tế bào gốc có khả năng đáng kinh ngạc là biến thành các loại tế bào khác trong cơ thể, rất hữu ích cho phát triển cách điều trị bệnh mới và có tiềm năng sửa chữa hoặc tái tạo mô, cơ quan. Tuy vậy, nhân bản trị liệu cũng có nhiều nhược điểm. Ngay cả khi quy trình thành công, cơ thể người nhận vẫn có khả năng đào thải các tế bào ngoại lai.", "Ngày nay có những cách dễ hơn để tạo tế bào đa năng, chẳng hạn tế bào gốc đa năng. Đây là những tế bào đã được tái lập trình để trở thành loại tế bào khác, có thể dùng hiệu quả trong điều trị. Phương pháp này cho phép làm gần như mọi điều nhân bản làm được một cách an toàn, đáng tin cậy, ngoại trừ tạo ra cả một động vật sống, điều mà như đã thấy không thực sự cần thiết. Vì vậy, nhân bản có lẽ ảnh hưởng đến điện ảnh nhiều hơn đời sống khoa học thực tế. Chỉ vì một việc có thể làm không có nghĩa là nó cần được làm."], "glossary": [["success rate", "səkˈses reɪt", "The percentage of attempts that succeed.", "tỷ lệ thành công"], ["overcome ethical issues", "ˌəʊvəˈkʌm ˈeθɪkəl ˈɪʃuːz", "Find a way to deal with moral problems.", "vượt qua các vấn đề đạo đức"], ["stem cells", "stem selz", "Cells that can develop into other types of cells.", "tế bào gốc"], ["for the sole purpose of", "fə ðə səʊl ˈpɜːpəs əv", "For this one aim only.", "chỉ nhằm mục đích · theo sau bởi danh từ/V-ing"], ["peace of mind", "piːs əv maɪnd", "A feeling of being calm and not worried.", "sự an tâm"]], "ovi": ["Những kỳ vọng sai lầm", "Nhân bản bị ngừng vì lý do đạo đức", "Công nghệ mới", "Các loại nhân bản cho những mục đích khác nhau", "Lý do thực sự chưa nhân bản người", "Cân nhắc rủi ro", "Cơ sở khoa học đằng sau việc nhân bản cừu Dolly", "Hiệu quả là trở ngại lớn nhất", "Từ bỏ quá sớm"]}]}]
